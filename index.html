<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Administración Inmobiliaria Inéz</title>
  <style>
    :root {
      --primary: #056648;
      --primary-dark: #023827;
      --primary-light: #e6f8f0;
      --danger: #d93025;
      --danger-light: #fef2f2;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --subtext: #64748b;
      --radius: 18px;
    }

    body.theme-esmeralda {
      background: #f8fafc;
      background-image: radial-gradient(at 0% 0%, rgba(5, 102, 72, 0.06) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.05) 0px, transparent 50%);
      background-attachment: fixed;
    }
    body.theme-oscuro {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --subtext: #94a3b8;
      background: #0b1120;
    }

    body.theme-oscuro .mora-banner {
      background: #ffffff !important;
      border-top: 1px solid #e2e8f0 !important;
      border-right: 1px solid #e2e8f0 !important;
      border-bottom: 1px solid #e2e8f0 !important;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35) !important;
    }
    body.theme-oscuro .mora-banner .mora-text h3 { color: #0f172a; }
    body.theme-oscuro .mora-banner .mora-text p { color: #64748b; }
    body.theme-oscuro .mora-banner .btn-details { color: #0f172a; border-color: #cbd5e1; }

    body.theme-oscuro .gastos-card {
      background: #ffffff !important;
      border: 1px solid #fecaca !important;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35) !important;
    }
    body.theme-oscuro .gastos-card div[style*="color:#991b1b"],
    body.theme-oscuro .gastos-card div[style*="color: #991b1b"] { color: #991b1b !important; }
    body.theme-oscuro .gastos-card div[style*="color:#b91c1c"],
    body.theme-oscuro .gastos-card div[style*="color: #b91c1c"] { color: #b91c1c !important; }
    body.theme-oscuro #txtTotalPereiraMenu,
    body.theme-oscuro #txtTotalCombiaMenu { color: #f8fafc !important; }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { color: var(--text); padding-bottom: 90px; min-height: 100vh; transition: background 0.3s ease, color 0.3s ease; }

    .sync-bar {
      background: rgba(226, 232, 240, 0.85); backdrop-filter: blur(8px);
      color: #475569; font-size: 0.7rem; font-weight: 700;
      text-align: center; padding: 5px 12px; display: flex; align-items: center; justify-content: center; gap: 6px;
      border-bottom: 1px solid rgba(203, 213, 225, 0.5);
    }
    body.theme-oscuro .sync-bar { background: #1e293b; color: #94a3b8; border-color: #334155; }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; display: inline-block; }
    .sync-dot.synced { background: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.6); }
    .sync-dot.syncing { background: #f59e0b; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

    header {
      background: linear-gradient(140deg, #064e3b 0%, #065f46 55%, #047857 100%);
      color: white; padding: 18px 16px 24px 16px;
      border-bottom-left-radius: 26px; border-bottom-right-radius: 26px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 10px 24px -6px rgba(6, 78, 59, 0.35);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .header-info { display: flex; align-items: center; gap: 12px; }
    .header-icon {
      background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(6px);
      width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }
    .header-title h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.2px; }
    .header-title p { font-size: 0.74rem; opacity: 0.9; margin-top: 2px; }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn {
      background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(6px); border-radius: 12px; width: 38px; height: 38px;
      display: grid; place-items: center; cursor: pointer; color: white; transition: all 0.2s ease;
    }
    .icon-btn:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.3); }

    .container { max-width: 500px; margin: 0 auto; padding: 0 16px; }

    .nav-tabs {
      display: flex; background: rgba(226, 232, 240, 0.9); backdrop-filter: blur(8px);
      border-radius: 16px; padding: 4px; margin-top: 14px; margin-bottom: 14px; gap: 4px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
    }
    body.theme-oscuro .nav-tabs { background: #1e293b; }
    .tab-btn {
      flex: 1; border: none; padding: 9px 6px; border-radius: 12px;
      font-size: 0.74rem; font-weight: 700; color: var(--subtext);
      background: transparent; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .tab-btn.active { background: var(--card-bg); color: var(--primary); box-shadow: 0 3px 10px rgba(0,0,0,0.08); }
    body.theme-oscuro .tab-btn.active { color: #34d399; }

    .tab-view { display: none; }
    .tab-view.active { display: block; animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .mora-banner {
      background: var(--card-bg); border-left: 5px solid var(--primary);
      border-radius: var(--radius); padding: 14px 16px; margin-top: -12px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
      border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    }
    .mora-content { display: flex; align-items: center; gap: 12px; }
    .mora-icon {
      background: #f1f5f9; color: var(--text); width: 36px; height: 36px;
      border-radius: 50%; display: grid; place-items: center; font-size: 17px; transition: all 0.3s ease;
    }
    .mora-text h3 { font-size: 0.86rem; font-weight: 800; color: var(--text); }
    .mora-text p { font-size: 0.72rem; color: var(--subtext); margin-top: 2px; }
