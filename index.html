  </div>

  <!-- MODAL VISOR DE COMPROBANTE DE PAGO -->
  <div class="modal" id="modalVisorRecibo">

        <h3 id="visorReciboTitulo" style="font-size:0.95rem;">Comprobante de Pago</h3>

        <div id="visorReciboInfo" style="font-size:0.75rem; color:var(--subtext); margin-bottom:10px;"></div>
